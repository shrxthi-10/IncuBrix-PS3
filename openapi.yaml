openapi: 3.1.0

info:
  title: IncuBrix Script-to-B-roll Video Engine API
  version: 0.3.0
  description: >
    API for submitting asynchronous script-to-video jobs from text or
    uploaded audio, checking job status, and inspecting generated video,
    subtitle, and manifest paths.

servers:
  - url: http://127.0.0.1:8000
    description: Local development server

tags:
  - name: Health
  - name: Jobs

paths:
  /health:
    get:
      tags: [Health]
      operationId: healthCheck
      summary: Check application health
      responses:
        "200":
          description: Application health information
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  timestamp:
                    type: string
                    format: date-time
                required: [status, timestamp]

  /ready:
    get:
      tags: [Health]
      operationId: readinessCheck
      summary: Check application readiness
      responses:
        "200":
          description: Application reports readiness
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ready
                required: [status]

  /api/v1/:
    get:
      tags: [Health]
      operationId: getApiInfo
      summary: Get API information
      responses:
        "200":
          description: API information
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                  version:
                    type: string
                  status:
                    type: string
                required: [name, version, status]

  /api/v1/jobs:
    post:
      tags: [Jobs]
      operationId: createVideoJob
      summary: Submit a script-to-video job
      description: >
        Creates an asynchronous text-to-video job. Reusing an
        Idempotency-Key with the same request returns the existing job.
        Reusing it with a different request returns a conflict.
        Jobs are currently stored in application memory.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: Unique client-generated key for this submission.
          schema:
            type: string
            minLength: 1
          example: 7a02f6de-1a8a-44e6-b1c8-29e3a8f3e9d0
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateJobRequest"
            example:
              script: "The water cycle moves water through evaporation and condensation."
              aspect_ratio: "16:9"
              narration_language: en
      responses:
        "202":
          description: Job accepted or existing idempotent job returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobSubmission"
        "409":
          description: Idempotency key reused with a different request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          description: Request validation error or missing idempotency key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/v1/jobs/audio:
    post:
      tags: [Jobs]
      operationId: createAudioVideoJob
      summary: Submit an audio-to-video job
      description: >
        Upload an MP3, WAV, or M4A audio file. The service transcribes
        the audio, selects B-roll, and renders a video asynchronously.
        The current implementation limits uploads to 100 MB and audio
        duration to 600 seconds.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: Unique client-generated key for this submission.
          schema:
            type: string
            minLength: 1
          example: 2b13fef3-b672-4f19-9a0c-1734bdc5f120
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [audio]
              properties:
                audio:
                  type: string
                  format: binary
                  description: Audio file in MP3, WAV, or M4A format.
                aspect_ratio:
                  type: string
                  default: "16:9"
                narration_language:
                  type: string
                  default: en
                  description: Language setting for the requested narration.
      responses:
        "202":
          description: Audio job accepted for asynchronous processing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AudioJobSubmission"
        "409":
          description: Idempotency key reused with a different request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "413":
          description: Uploaded audio exceeds the file-size limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "415":
          description: Unsupported audio file extension
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          description: Empty, invalid, or too-long audio or invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/v1/jobs/{job_id}:
    get:
      tags: [Jobs]
      operationId: getVideoJob
      summary: Get job status and result
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Current job status, progress, request, and result if available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobStatus"
        "404":
          description: Job ID not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          description: Invalid job ID path parameter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

components:
  schemas:
    CreateJobRequest:
      type: object
      properties:
        script:
          type: string
          minLength: 1
          maxLength: 50000
        aspect_ratio:
          type: string
          default: "16:9"
        narration_language:
          type: string
          default: en
      required: [script]

    JobSubmission:
      type: object
      properties:
        job_id:
          type: string
          format: uuid
        status:
          type: string
          example: queued
        progress:
          type: integer
          minimum: 0
          maximum: 100
        status_url:
          type: string
          example: /api/v1/jobs/00000000-0000-4000-8000-000000000000
      required: [job_id, status, progress, status_url]

    AudioJobSubmission:
      type: object
      properties:
        job_id:
          type: string
          format: uuid
        status:
          type: string
          example: queued
        progress:
          type: integer
          minimum: 0
          maximum: 100
        audio_duration_seconds:
          type: number
          exclusiveMinimum: 0
          maximum: 600
        status_url:
          type: string
          example: /api/v1/jobs/00000000-0000-4000-8000-000000000000
      required:
        - job_id
        - status
        - progress
        - audio_duration_seconds
        - status_url

    JobStatus:
      type: object
      description: >
        Job fields returned by the current in-memory job manager.
        Audio jobs may include transcript and transcription metadata.
      properties:
        job_id:
          type: string
          format: uuid
        status:
          type: string
          description: Current processing state.
          example: running
          enum: [queued, running, succeeded, failed]
        progress:
          type: integer
          minimum: 0
          maximum: 100
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        request:
          type: object
          additionalProperties: true
          description: Original job request, including input type.
        result:
          anyOf:
            - $ref: "#/components/schemas/JobResult"
            - type: "null"
        error:
          anyOf:
            - $ref: "#/components/schemas/ApiError"
            - type: string
            - type: "null"
        transcript:
          type: string
          description: Transcript produced for an audio input, when available.
        transcription:
          type: object
          additionalProperties: true
          description: Transcription language, probability, and model metadata.
      required:
        - job_id
        - status
        - progress
        - created_at
        - updated_at
        - request
        - result
        - error

    JobResult:
      type: object
      properties:
        video_file:
          type: string
          description: Local filesystem path to the generated MP4.
        manifest_file:
          type: string
          description: Local filesystem path to the render manifest.
        subtitle_file:
          type: string
          description: Local filesystem path to the subtitle file.
        duration_seconds:
          type: number
        resolution:
          type: string
          example: "1280x720"
        scene_count:
          type: integer
        input_type:
          type: string
          enum: [text, audio]
        transcript:
          anyOf:
            - type: string
            - type: "null"
        warnings:
          type: array
          items:
            type: string
      required:
        - video_file
        - manifest_file
        - subtitle_file
        - duration_seconds
        - resolution
        - scene_count
        - warnings
      additionalProperties: true

    ApiError:
      type: object
      required:
        - code
        - message
        - retryable
        - details
      properties:
        code:
          type: string
          description: Uppercase snake-case error code.
          example: JOB_NOT_FOUND
        message:
          type: string
          example: No job exists with this ID.
        retryable:
          type: boolean
          example: false
        details:
          type: object
          additionalProperties: true
          example:
            job_id: nonexistent-test-job